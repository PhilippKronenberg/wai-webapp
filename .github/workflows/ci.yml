name: CI

# Nothing used to stand between a commit and the live dashboard. index.html is
# the entire application and wai_data.csv the entire data layer, so a malformed
# commit to either published straight to
# https://philippkronenberg.github.io/wai-webapp/ with nothing in the way.
#
# Everything here runs without installing anything into the repository. This
# project has no build step and no node_modules by design, and CI should not be
# what introduces one: the validator uses Node built-ins only, and html-validate
# is fetched by npx at run time rather than declared as a dependency.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deterministic checks. These gate merges: each one fails only when something
  # is genuinely wrong, never because a third party had a bad minute.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Checks wai_data.csv against itself (dates strictly increasing, no
      # duplicates, numeric columns numeric, confidence bands not crossed),
      # against wai_meta.json (the metadata restates facts derivable from the
      # CSV -- n_obs, first/last_obs_date, latest_* -- and index.html reads none
      # of them, so they can drift silently while the page still looks right),
      # and that every local src/href in index.html resolves to a file that
      # exists.
      - name: Validate data and internal references
        run: node tools/validate-data.mjs

      # Chart.js is vendored rather than CDN-loaded as a deliberate
      # supply-chain choice. An unreviewed change to a vendored file is exactly
      # the risk that choice was meant to remove, so pin the bytes.
      # Regenerate deliberately when upgrading:
      #   sha256sum vendor/chart.umd.js vendor/*.min.js > vendor/SHA256SUMS
      - name: Verify vendored assets are unmodified
        run: sha256sum -c vendor/SHA256SUMS

      # index.html is the whole application; if it does not parse, the site is
      # broken. Measured clean on the current file, and confirmed to fail on
      # malformed input rather than passing everything.
      - name: Validate HTML
        run: npx --yes html-validate index.html

  # Advisory, deliberately not a merge gate. External link checking depends on
  # other people's servers being reachable and willing, which makes it exactly
  # the kind of check that fails for reasons unrelated to the change under
  # review. Gating merges on it teaches people to ignore red, which costs more
  # than the occasional stale link.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      # 403 counts as alive. index.html cites doi:10.1002/jae.3104, which
      # resolves to onlinelibrary.wiley.com, and Wiley returns 403 to any
      # non-browser client -- including one sending a full desktop user agent.
      # That is bot protection, not a dead link: the DOI is registered and
      # resolvable. Treating 403 as a failure would make this job permanently
      # red for a link that is correct.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,403
            --max-retries 2
            index.html README.md
          fail: true

  # Also advisory, and for a different reason than links: this one reports on
  # the page as it stands rather than on the change under review, so on the day
  # it was added it was already red. Gating merges on it would mean every
  # unrelated PR carries the cost of whatever the page has always done. Promote
  # it to a gate once the backlog it reports is empty -- moving this job into
  # `check` is then a two-line change.
  #
  # Nothing is installed into the repository. axe is fetched by npx the way
  # html-validate is, Chrome and chromedriver are preinstalled on the runner,
  # and the server is Python's stdlib one.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # index.html fetches wai_data.csv and wai_meta.json, and browsers block
      # fetch() over file://. Pointed at the file, an auditor would grade the
      # error banner -- a nearly empty page that reports almost nothing and
      # looks like a pass. It has to be served.
      - name: Serve the page
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for _ in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/index.html; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::local server never answered on 127.0.0.1:8787"
          exit 1

      # The failure this guards against is silent: if the data never arrives,
      # axe still runs, still reports, and still looks like a real audit of a
      # page that mostly is not there. So assert on the parts of the DOM that
      # only exist once the CSV has been fetched and drawn -- the stat tiles are
      # built by renderStats(), and the canvas only carries width/height
      # attributes once Chart.js has sized it.
      - name: Confirm the dashboard rendered
        run: |
          google-chrome --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=8000 --dump-dom \
            http://127.0.0.1:8787/ >/tmp/dumped.html 2>/dev/null
          # renderStats() builds the tiles from a string literal that contains
          # the tile markup, and --dump-dom serialises the inline script along
          # with everything else. Grep the raw dump and the source counts as a
          # rendered tile even when nothing rendered at all.
          perl -0777 -pe 's{<script\b.*?</script>}{}gsi' \
            /tmp/dumped.html >/tmp/rendered.html
          tiles=$(grep -o 'class="stat-value"' /tmp/rendered.html | wc -l)
          echo "stat tiles rendered: $tiles"
          grep -o '<canvas id="chart"[^>]*>' /tmp/rendered.html || true
          [ "$tiles" -ge 1 ] \
            || { echo "::error::no stat tiles -- the data never loaded"; exit 1; }
          grep -q '<canvas id="chart" width=' /tmp/rendered.html \
            || { echo "::error::chart canvas was never sized by Chart.js"; exit 1; }
          grep -q 'class="controls"' /tmp/rendered.html \
            || { echo "::error::controls missing from the rendered page"; exit 1; }
          grep -q 'id="error-banner" hidden' /tmp/rendered.html \
            || { echo "::error::the page is showing its error banner"; exit 1; }

      # Pinned to the major because the flags below are a CLI contract; the rule
      # set inside it is free to move, since nothing here gates on the result.
      # --exit makes this step red when there are violations, which is the point
      # -- continue-on-error keeps that from blocking anyone.
      - name: Audit accessibility
        run: |
          driver="${CHROMEWEBDRIVER:+$CHROMEWEBDRIVER/chromedriver}"
          [ -x "$driver" ] || driver="$(command -v chromedriver)"
          npx --yes @axe-core/cli@4 http://127.0.0.1:8787/ \
            --chromedriver-path "$driver" \
            --chrome-options="headless,no-sandbox,disable-gpu,disable-dev-shm-usage" \
            --load-delay 2000 \
            --dir /tmp --save axe-results.json \
            --exit

      # The CLI already prints its findings, but they scroll past in a log
      # nobody opens. Restate them on the run summary page instead.
      - name: Summarise findings
        if: always()
        run: |
          [ -f /tmp/axe-results.json ] || exit 0
          node .github/scripts/a11y-summary.mjs /tmp/axe-results.json \
            >> "$GITHUB_STEP_SUMMARY"
