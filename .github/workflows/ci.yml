name: CI

# Nothing used to stand between a commit and the live dashboard. index.html is
# the entire application and wai_data.csv the entire data layer, so a malformed
# commit to either published straight to
# https://philippkronenberg.github.io/wai-webapp/ with nothing in the way.
#
# Everything here runs without installing anything into the repository. This
# project has no build step and no node_modules by design, and CI should not be
# what introduces one: the validator uses Node built-ins only, and html-validate
# is fetched by npx at run time rather than declared as a dependency.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Added for the `freshness` job below, which runs on nothing else: it watches
  # a quantity that moves at most once a week, so weekly is plenty. The other
  # jobs come along for the ride, which is no loss -- `check` fetches
  # html-validate at run time, so a weekly run is also a canary on that.
  # Scheduled runs always use the default branch. Note that GitHub disables
  # schedules in a repository with no activity for 60 days: if the alarm ever
  # goes quiet, check first that it has not simply been switched off.
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC

concurrency:
  # The event is part of the group so that a push to main cannot cancel a
  # scheduled run in flight: both carry ref refs/heads/main, and a cancelled
  # run is green, so the staleness alarm would be silently swallowed by
  # ordinary activity -- the exact failure it exists to catch.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deterministic checks. These gate merges: each one fails only when something
  # is genuinely wrong, never because a third party had a bad minute.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Checks wai_data.csv against itself (dates strictly increasing, no
      # duplicates, numeric columns numeric, confidence bands not crossed),
      # against wai_meta.json (the metadata restates facts derivable from the
      # CSV -- n_obs, first/last_obs_date, latest_* -- and index.html reads none
      # of them, so they can drift silently while the page still looks right),
      # and that every local src/href in index.html resolves to a file that
      # exists.
      - name: Validate data and internal references
        run: node tools/validate-data.mjs

      # Chart.js is vendored rather than CDN-loaded as a deliberate
      # supply-chain choice. An unreviewed change to a vendored file is exactly
      # the risk that choice was meant to remove, so pin the bytes.
      # Regenerate deliberately when upgrading:
      #   sha256sum vendor/chart.umd.js vendor/*.min.js > vendor/SHA256SUMS
      - name: Verify vendored assets are unmodified
        run: sha256sum -c vendor/SHA256SUMS

      # index.html is the whole application; if it does not parse, the site is
      # broken. Measured clean on the current file, and confirmed to fail on
      # malformed input rather than passing everything.
      - name: Validate HTML
        run: npx --yes html-validate index.html

  # The alarm for a pipeline that has quietly stopped. A dead pipeline emits
  # nothing at all, and the page goes on serving stale numbers that look
  # entirely correct; this inverts that, producing a signal precisely when
  # nothing is happening. A failed scheduled run on the default branch emails
  # the repository owner, so the notification needs nothing configured -- which
  # is also why this job must not be `continue-on-error`, as that would leave
  # the run green and send no mail.
  #
  # Scheduled and manual only. It is not in `check` because it fails on the
  # calendar rather than on the diff, and a gate that fails a correct pull
  # request for a reason its author cannot fix is a gate people learn to
  # override. The threshold, which is the entire design here, lives next to the
  # check in tools/validate-data.mjs.
  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the published vintage has not gone stale
        run: node tools/validate-data.mjs --check-staleness

  # Advisory, deliberately not a merge gate. External link checking depends on
  # other people's servers being reachable and willing, which makes it exactly
  # the kind of check that fails for reasons unrelated to the change under
  # review. Gating merges on it teaches people to ignore red, which costs more
  # than the occasional stale link.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      # 403 counts as alive. index.html cites doi:10.1002/jae.3104, which
      # resolves to onlinelibrary.wiley.com, and Wiley returns 403 to any
      # non-browser client -- including one sending a full desktop user agent.
      # That is bot protection, not a dead link: the DOI is registered and
      # resolvable. Treating 403 as a failure would make this job permanently
      # red for a link that is correct.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,403
            --max-retries 2
            index.html README.md
          fail: true

  # A merge gate, but kept as its own job rather than folded into `check`, so an
  # accessibility failure and a malformed CSV do not look alike in the checks
  # list. It was advisory while the page carried a backlog of violations, since
  # it grades the page as it stands rather than the change under review; that
  # backlog is empty in all three palettes, so a red run now means something new
  # broke (#21).
  #
  # Nothing is installed into the repository. axe-core is fetched from the
  # registry at run time the way html-validate is, Chrome and chromedriver are
  # preinstalled on the runner, and the server is Python's stdlib one.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # index.html fetches wai_data.csv and wai_meta.json, and browsers block
      # fetch() over file://. Pointed at the file, an auditor would grade the
      # error banner -- a nearly empty page that reports almost nothing and
      # looks like a pass. It has to be served.
      - name: Serve the page
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for _ in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/index.html; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::local server never answered on 127.0.0.1:8787"
          exit 1

      # Fetched at run time into /tmp, never into the repository -- the same
      # bargain html-validate gets from npx. Pinned to the major: the driver
      # only uses axe.run(). The rule set inside is free to move, so a new rule
      # in a minor release can turn an unrelated PR red. That is accepted: it is
      # a real finding about the page, not noise.
      - name: Fetch axe-core
        run: |
          npm pack axe-core@4 --pack-destination /tmp --silent
          tar -xzf /tmp/axe-core-*.tgz -C /tmp
          test -f /tmp/package/axe.min.js

      # Three passes, because the page has three palettes and a browser is only
      # ever in one of them. Light, dark reached by pressing the theme button,
      # and dark reached by emulating a dark system. Both contrast bugs this
      # repository has produced lived in a dark block and the single light pass
      # this replaces was green through both; #11 lived only in the toggle
      # block, so the button has to actually be pressed.
      #
      # The script drives the preinstalled chromedriver over plain HTTP with
      # fetch -- Node built-ins only, nothing installed. It re-runs the "did the
      # dashboard actually render" guard in front of every pass and again after
      # each theme switch, in the same browser session it then audits, so
      # neither a data failure nor a theme switch that breaks the page can
      # masquerade as a clean audit.
      #
      # Exit 1 means violations; exit 2 means the audit never ran at all. Both
      # fail the job.
      - name: Audit accessibility in every palette
        run: |
          node .github/scripts/a11y-audit.mjs \
            http://127.0.0.1:8787/ \
            /tmp/package/axe.min.js \
            /tmp/axe-results.json

      # The audit already prints its findings, but they scroll past in a log
      # nobody opens. Restate them on the run summary page instead, one section
      # per palette.
      - name: Summarise findings
        if: always()
        run: |
          [ -f /tmp/axe-results.json ] || exit 0
          node .github/scripts/a11y-summary.mjs /tmp/axe-results.json \
            >> "$GITHUB_STEP_SUMMARY"
